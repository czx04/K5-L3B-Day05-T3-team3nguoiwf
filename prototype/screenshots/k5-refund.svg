<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><style>.title{font:700 26px Arial;fill:#172554}.txt{font:16px Arial;fill:#1f2937}.small{font:14px Arial;fill:#4b5563}.bold{font-weight:700}.white{fill:white}</style></defs><rect width="1200" height="720" fill="#e5e7eb"/><text x="45" y="48" class="title">K5 · Khách tự chọn người và gửi yêu cầu hoàn</text>
<rect x="45" y="75" width="470" height="600" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M45 105a30 30 0 0 1 30-30h410a30 30 0 0 1 30 30v48H45z" fill="#2563eb"/><text x="75" y="120" class="white bold" font-size="20">Đặt chỗ của tôi · TRV-7Q2K</text>
<rect x="82" y="190" width="395" height="195" rx="16" fill="#fff" stroke="#d1d5db"/><text x="105" y="225" class="small bold">TRỢ LÝ ĐẶT CHỖ (AI)</text><text x="105" y="260" class="txt">Trước khi hoàn vé, bạn cần biết:</text><circle cx="110" cy="298" r="17" fill="#c2410c"/><text x="105" y="304" class="white bold">3</text><text x="140" y="296" class="txt bold">Gửi rồi không thể huỷ</text><text x="140" y="321" class="small">Tiền về thẻ tới 90 ngày · không bồi thường do bão</text><text x="105" y="356" class="small">Đổi miễn phí sang BM 201 còn 9 chỗ cho 2 người</text>
<rect x="82" y="405" width="395" height="235" rx="20" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="110" y="442" class="title" font-size="21" fill="#b91c1c">Xác nhận hoàn vé</text><text x="110" y="472" class="small">Chọn hành khách cần hoàn (không chọn sẵn)</text><rect x="110" y="490" width="20" height="20" fill="#fff" stroke="#6b7280"/><text x="145" y="506" class="txt">Nguyễn Minh An</text><rect x="110" y="525" width="20" height="20" fill="#fff" stroke="#6b7280"/><text x="145" y="541" class="txt">Nguyễn Gia Bình (5t)</text><rect x="110" y="563" width="20" height="20" fill="#fff" stroke="#6b7280"/><text x="145" y="579" class="small bold">Tôi hiểu yêu cầu không rút lại được</text><rect x="110" y="600" width="335" height="28" rx="8" fill="#fca5a5"/><text x="175" y="620" class="small bold" fill="#7f1d1d">Gửi yêu cầu (đang khóa)</text>
<circle cx="550" cy="297" r="20" fill="#c2410c"/><text x="544" y="304" class="white bold" font-size="20">3</text><path d="M530 297H480" stroke="#c2410c" stroke-width="3"/><text x="590" y="288" class="title" font-size="21">Minh bạch hệ quả · G2</text><text x="590" y="321" class="txt">Nêu tính không thể rút lại, thời gian</text><text x="590" y="347" class="txt">hoàn tiền và quyền lợi thực tế.</text><text x="590" y="410" class="title" font-size="21">Giới hạn thao tác · G10</text><text x="590" y="443" class="txt">AI chỉ soạn thông tin. Chủ tài khoản</text><text x="590" y="469" class="txt">chọn hành khách, hiểu hệ quả và tự gửi.</text><text x="590" y="528" class="small">Mức tự chủ: soạn yêu cầu = AI tự làm;</text><text x="590" y="552" class="small">gửi hoàn = chỉ UI của chủ tài khoản.</text><text x="590" y="610" class="small">Ảnh minh họa; gửi hoàn trong trang là mock.</text>
</svg>
